        function AKI() {
            // URI TABLE
            var pat_gew = document.getElementById("pat_gewicht").value;
            const div6 = document.getElementById("six_cut");
            const div12 = document.getElementById("twelve_cut");
            const div24 = document.getElementById("twentyfour_cut");
            div6.innerText = "< " + (pat_gew*0.5).toFixed(1) + "ml/h";
            div12.innerText = "< " + (pat_gew*0.5).toFixed(1) + "ml/h";
            div24.innerText = "< " + (pat_gew*0.3).toFixed(1) + "ml/h";

            for (let i = 6; i <= tbl_reihe; i++){
                let section = 0;
                for (let j = 0; j < 6; j++){
                    section += parseFloat(document.getElementById("row" + (i-j)).value) || 0;
                }
                let cell = document.getElementById(i + "six");
                if((section/6) < (pat_gew*0.5)){
                    cell.bgColor = "#E3D394";
                    cell.textContent = (section/6).toFixed(1);
                } else {
                    cell.bgColor = "white";
                    cell.textContent = "";
                }
                
                if(i >= 12){
                    section = 0;
                    for (let l = 0; l < 12; l++){
                        section += parseFloat(document.getElementById("row" + (i-l)).value) || 0;
                    }
                    let cell1 = document.getElementById(i + "twelve");
                    let cell3 = document.getElementById(i + "anu");
                    if((section/12) < (pat_gew*0.5)){
                        cell1.bgColor = "#DBBA35";
                        cell1.textContent = (section/12).toFixed(1);
                        if(section == 0) {
                            cell3.textContent = 0;
                            cell3.bgColor = "#453A0D";
                        } else {
                            cell3.textContent = "";
                            cell3.bgColor = "white";
                        }
                    } else {
                        cell1.bgColor = "white";
                        cell1.textContent = "";
                    }
                }
                
                if(i >= 24){
                    section = 0;
                    for (let m = 0; m < 24; m++){
                        section += parseFloat(document.getElementById("row" + (i-m)).value) || 0;
                    }
                    let cell2 = document.getElementById(i + "tf");
                    if((section/24) < (pat_gew*0.3)){
                        cell2.bgColor = "#453A0D";
                        cell2.textContent = (section/24).toFixed(1);
                    } else {
                        cell2.bgColor = "white";
                        cell2.textContent = "";
                    }
                }
            }

            // KREATININ TABLE - VERSION MIT 2 ARRAYS
            let baselineValue = parseFloat(document.getElementById("k_row2").value) || 0;
            let baselineDate = new Date(document.getElementById("k_row12").value);
            
            if(baselineValue === 0 || isNaN(baselineValue) || !document.getElementById("k_row12").value){
                return;
            }

            const ms_48h = 48*60*60*1000;
            const ms_7d = 7*24*60*60*1000;

            // 1. UNSORTIERTES ARRAY - behält die Eingabe-Reihenfolge
            let unsortedData = [];
            for (let i = 2; i < tbl_reihe_krea; i++){
                let dateInput = document.getElementById("k_row1"+(i+1)).value;
                let valueInput = parseFloat(document.getElementById("k_row"+(i+1)).value);
                
                if(dateInput && !isNaN(valueInput)){
                    let currDate = new Date(dateInput);
                    
                    // Prüfung ob Datum vor Baseline liegt
                    if(currDate < baselineDate){
                        alert("Das Datum von Wert " + i + " liegt vor der Baseline! Bitte korrigieren.");
                        document.getElementById("k_row1"+(i+1)).value = "";
                        continue;
                    }
                    
                    unsortedData.push({
                        datum: currDate,
                        wert: valueInput,
                        inputIndex: i+1
                    });
                }
            }

            // 2. SORTIERTES ARRAY - für chronologische Berechnungen
            // WICHTIG: Baseline zuerst hinzufügen!
            let sortedData = [{
                datum: baselineDate,
                wert: baselineValue,
                inputIndex: 2  // Baseline ist in k_row2
            }];
            
            // Dann alle anderen Werte hinzufügen und sortieren
            sortedData = sortedData.concat([...unsortedData]);
            sortedData.sort((a, b) => a.datum - b.datum);

            // Durchlaufe das UNSORTIERTE Array (um die Ergebnisse in die richtigen Zellen zu schreiben)
            for (let i = 0; i < unsortedData.length; i++){
                let currData = unsortedData[i];
                let currValue = currData.wert;
                let currDate = currData.datum;
                let inputIdx = currData.inputIndex;
                
                // Finde die Position im SORTIERTEN Array
                let sortedIdx = sortedData.findIndex(item => 
                    item.datum.getTime() === currDate.getTime() && 
                    item.inputIndex === inputIdx
                );

                // Alle Zellen für diesen Wert
                let cell4 = document.getElementById(inputIdx + "k_row2");
                let cell5 = document.getElementById(inputIdx + "k_row3");
                let cell6 = document.getElementById(inputIdx + "k_row5");
                let cell7 = document.getElementById(inputIdx + "k_row4");
                let cell8 = document.getElementById(inputIdx + "k_row6");

                // Stadium 1 (1.5-1.9x Baseline innerhalb 7d)
                if(currValue >= baselineValue*1.5 && currValue <= baselineValue*1.9){
                    if(Math.abs(currDate - baselineDate) <= ms_7d) {
                        cell4.bgColor = "#E3D394";
                        cell4.textContent = "Stadium 1";
                    } else {
                        cell4.textContent = ">7d";
                        cell4.bgColor = "white";
                    }
                } else if (currValue < baselineValue*1.5){
                    cell4.textContent = "Anstieg < 1,5-fach";
                    cell4.bgColor = "white";
                } else if (currValue > baselineValue*1.9){
                    cell4.textContent = "Anstieg > 1.9-fach";
                    cell4.bgColor = "white";
                }

                // Stadium 1 (Anstieg ≥ 0.3 mg/dl innerhalb 48h)
                // Nutze das SORTIERTE Array für die Berechnung
                let found48h = false;
                for (let m = sortedIdx - 1; m >= 0; m--) {
                    const diff = currDate - sortedData[m].datum;
                    
                    if (diff <= ms_48h) {
                        found48h = true;
                        let pastValue = sortedData[m].wert;
                        
                        if ((currValue - pastValue) >= 0.3) {
                            cell5.bgColor = "#E3D394";
                            cell5.textContent = "Stadium 1";
                        } else {
                            cell5.textContent = "Anstieg < 0,3 mg/dl";
                            cell5.bgColor = "white";
                        }
                        break;
                    }
                }
                if (!found48h) {
                    cell5.textContent = ">48h";
                    cell5.bgColor = "white";
                }

                // Stadium 2 (2-2.9x Baseline)
                if(currValue >= baselineValue*2 && currValue <= baselineValue*2.9){
                    cell7.bgColor = "#DBBA35";
                    cell7.textContent = "Stadium 2";
                } else if (currValue < baselineValue*2){
                    cell7.textContent = "Anstieg < 2-fach";
                    cell7.bgColor = "white";
                } else if (currValue > baselineValue*2.9){
                    cell7.textContent = "Anstieg > 2.9-fach";
                    cell7.bgColor = "white";
                }

                // Stadium 3 (≥ 3x Baseline)
                if(currValue >= baselineValue*3){
                    cell6.bgColor = "#453A0D";
                    cell6.textContent = "Stadium 3";
                } else {
                    cell6.textContent = "Anstieg < 3-fach";
                    cell6.bgColor = "white";
                }

                // Stadium 3 (≥ 4 mg/dl bei akutem Anstieg um mind. 0,5 mg/dl)
                // Nutze das SORTIERTE Array für die Berechnung
                if(currValue >= 4){
                    let found = false;
                    for(let n = sortedIdx - 1; n >= 0; n--){
                        let pastValue = sortedData[n].wert;
                        if((currValue - pastValue) >= 0.5){
                            cell8.bgColor = "#453A0D";
                            cell8.textContent = "Stadium 3";
                            found = true;
                            break;
                        }
                    }
                    if(!found){
                        cell8.textContent = "Anstieg < 0.5 mg/dl";
                        cell8.bgColor = "white";
                    }
                } else if (currValue < 4){
                    cell8.textContent = "Wert < 4 mg/dl";
                    cell8.bgColor = "white";
                }
            }
        }

        function RRT(){
            if(document.getElementById("rRT_select").value === "ja"){
                document.getElementById("RRT_Status").innerHTML = "Stadium 3";
                document.getElementById("RRT_Status").bgColor = "#453A0D";
                document.getElementById("RRT_Status").style.color = "white";
            } else {
                document.getElementById("RRT_Status").innerHTML = "";
                document.getElementById("RRT_Status").bgColor = "white";
                document.getElementById("RRT_Status").style.color = "black";
            }
        }

        window.addEventListener("input", AKI);
        window.addEventListener("input", RRT);
        window.addEventListener("input", Uhrzeit);
    </script>
</body>
</html>
